[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantai-platform"
version = "0.1.0"
description = "Explainable quantitative portfolio optimization and risk analysis platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "numpy>=2.0,<3.0",
  "openai>=3.20,<4.0",
  "pandas>=3.0,<4.0",
  "plotly>=7.1,<8.0",
  "pydantic>=2.11,<3.0",
  "scikit-learn>=1.7,<2.0",
  "scipy>=1.15,<2.0",
  "torch>=2.7,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
  "xgboost>=3.0,<4.0",
  "yfinance>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pandas-stubs>=2.2,<4.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
